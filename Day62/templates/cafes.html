{% extends 'base.html' %}
{% block title %}All Cafes{% endblock %}

{% block content %}
<div class="container">
  <h1>All Cafes</h1>
  <table>
    {% for row in cafes %}
    <tr>
      {% for item in row %}
        {% if item[0:4] == "http" %}
          <td><a href="{{ item }}" target="_blank">Maps Link</a></td>
        {% else %}
          <td>{{ item }}</td>
        {% endif %}
      {% endfor %}
    </tr>
    {% endfor %}
  </table>
  <p><a href="{{ url_for('home') }}">Return to index page</a></p>
</div>
{% endblock %}
