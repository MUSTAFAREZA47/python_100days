<!DOCTYPE html>
<html>
<head>
    <title>Todo App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1 class="mb-4">Todo List</h1>

    <!-- Add Task -->
    <form action="{{ url_for('add') }}" method="POST" class="d-flex mb-3">
        <input class="form-control me-2" type="text" name="task" placeholder="Add new task">
        <button class="btn btn-primary">Add</button>
    </form>

    <!-- Task List -->
    <ul class="list-group">
        {% for todo in todos %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <span class="{% if todo.complete %}text-decoration-line-through{% endif %}">
                {{ todo.task }}
            </span>
            <div>
                <a href="{{ url_for('update', todo_id=todo.id) }}" class="btn btn-sm btn-success">✔</a>
                <a href="{{ url_for('delete', todo_id=todo.id) }}" class="btn btn-sm btn-danger">✘</a>
            </div>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
